<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEPLR — Legal</title>
<style>
  :root{--bg:#161218;--sf:#1E1824;--bd:#2A2232;--tx:#EDE7F0;--t2:#A79DAE;--ac:#FF6B4A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh;
       display:flex;align-items:center;justify-content:center;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:32px 20px}
  main{max-width:440px;width:100%}
  .mark{width:56px;height:56px;border-radius:16px;
        background:linear-gradient(135deg,#FF6B4A,#F5A623);
        display:flex;align-items:center;justify-content:center;
        font-size:24px;font-weight:900;color:#1A0F0A;margin-bottom:20px}
  h1{font-size:26px;letter-spacing:-.5px;margin:0 0 6px}
  p.sub{color:var(--t2);font-size:14px;margin:0 0 28px}
  a.card{display:block;background:var(--sf);border:1px solid var(--bd);
         border-radius:14px;padding:16px 18px;margin-bottom:10px;
         text-decoration:none;color:var(--tx);transition:border-color .15s}
  a.card:hover{border-color:var(--ac)}
  a.card strong{display:block;font-size:15px;margin-bottom:2px}
  a.card span{color:var(--t2);font-size:13px}
  footer{margin-top:28px;color:var(--t2);font-size:12px}
  footer a{color:var(--ac)}
</style>
</head>
<body>
<main>
  <div class="mark">P</div>
  <h1>PEPLR</h1>
  <p class="sub">Community app for Miami. Legal documents below.</p>

  <a class="card" href="privacy.html">
    <strong>Privacy Policy</strong>
    <span>What we collect, what we never do, and how to delete everything</span>
  </a>

  <a class="card" href="terms.html">
    <strong>Terms of Service</strong>
    <span>The agreement between you and PEPLR</span>
  </a>

  <footer>
    Questions: <a href="mailto:privacy@peplr.app">privacy@peplr.app</a><br>
    Safety: <a href="mailto:safety@peplr.app">safety@peplr.app</a><br><br>
    &copy; 2026 Mayron Leon Taylor III &middot; Miami, Florida
  </footer>
</main>
</body>
</html>
